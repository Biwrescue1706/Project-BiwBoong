<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>📉 กราฟการใช้ไฟฟ้า · BiwBong Utilities</title>

    <link rel="icon" type="image/png" href="/images/logo.png" />

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>

  <body
    class="min-h-screen bg-gradient-to-br from-green-50 via-white to-teal-50 text-gray-800"
  >
    <!-- =====================================================
         Navbar
    ====================================================== -->
    <nav
      class="sticky top-0 z-50 bg-gradient-to-r from-green-600 to-teal-600 text-white shadow-lg"
    >
      <div class="mx-auto flex max-w-6xl items-center px-4 py-4">
        <!-- Logo -->
        <img
          src="/images/logo.png"
          height="40"
          alt="logo"
          id="navToggle"
          role="button"
          tabindex="0"
          aria-controls="navDrawer"
          aria-expanded="false"
          class="mr-3 h-10 w-10 cursor-pointer rounded-full bg-white object-contain p-1 shadow-md transition duration-300 hover:scale-110"
        />

        <!-- Title -->
        <h1 class="text-lg font-bold sm:text-xl md:text-2xl">
          ระบบคำนวณ ค่าใช้จ่าย BiwBong Utilities
        </h1>
      </div>

      <!-- =================================================
             Drawer
        ================================================== -->
      <div
        id="navDrawer"
        aria-hidden="true"
        class="fixed left-0 top-0 z-[60] h-full w-80 max-w-[85vw] -translate-x-full bg-white text-gray-800 shadow-2xl transition-transform duration-300"
      >
        <!-- Drawer Header -->
        <div
          class="flex items-center justify-between bg-gradient-to-r from-green-600 to-teal-600 px-5 py-4 text-white"
        >
          <span class="flex items-center text-lg font-bold">
            <img
              src="/images/logo.png"
              alt="หน้าแรก"
              height="32"
              class="mr-2 h-8 w-8 rounded-full bg-white object-contain p-1"
            />

            เมนู
          </span>

          <!-- Close Button -->
          <button
            id="drawerClose"
            class="flex h-9 w-9 items-center justify-center rounded-full bg-white/20 text-xl transition hover:bg-white/30"
            aria-label="ปิดเมนู"
          >
            ✕
          </button>
        </div>

        <!-- Menu -->
        <div class="flex flex-col gap-1 p-4">
          <a
            href="/"
            class="rounded-xl px-4 py-3 font-medium transition hover:bg-green-50 hover:text-green-600"
          >
            ➕ เพิ่มข้อมูลมิเตอร์
          </a>

          <a
            href="/summary"
            class="rounded-xl px-4 py-3 font-medium transition hover:bg-green-50 hover:text-green-600"
          >
            📊 สรุปรวม
          </a>

          <a
            href="/history-electric"
            class="rounded-xl px-4 py-3 font-medium transition hover:bg-green-50 hover:text-green-600"
          >
            ⚡ ประวัติการใช้ไฟฟ้า
          </a>

          <a
            href="/history-water"
            class="rounded-xl px-4 py-3 font-medium transition hover:bg-green-50 hover:text-green-600"
          >
            💧 ประวัติการใช้น้ำ
          </a>

          <a
            href="/graph-electric"
            class="rounded-xl bg-gradient-to-r from-green-600 to-teal-600 px-4 py-3 font-semibold text-white shadow-md"
          >
            📉 กราฟการใช้ไฟฟ้า
          </a>

          <a
            href="/graph-water"
            class="rounded-xl px-4 py-3 font-medium transition hover:bg-green-50 hover:text-green-600"
          >
            📈 กราฟการใช้น้ำ
          </a>
        </div>
      </div>
    </nav>

    <!-- =====================================================
         Backdrop
    ====================================================== -->
    <div
      id="backdrop"
      class="fixed inset-0 z-40 hidden bg-black/50 opacity-0 backdrop-blur-sm transition-opacity duration-300"
    ></div>

    <!-- =====================================================
         Main Content
    ====================================================== -->
    <main class="mx-auto max-w-6xl px-4 py-8 sm:py-12">
      <section
        class="overflow-hidden rounded-3xl bg-white shadow-xl ring-1 ring-gray-100"
      >
        <!-- Header -->
        <div
          class="bg-gradient-to-r from-green-600 to-teal-600 px-6 py-8 text-center text-white"
        >
          <h2 class="text-2xl font-extrabold sm:text-3xl md:text-4xl">
            📉 แนวโน้มการใช้ไฟฟ้า
          </h2>

          <p id="status" class="mt-2 text-sm text-green-50 sm:text-base">
            กำลังโหลดข้อมูล…
          </p>
        </div>

        <!-- =================================================
                 Chart
            ================================================== -->
        <div class="p-4 sm:p-6 lg:p-8">
          <div
            class="relative h-[400px] w-full rounded-2xl border border-gray-200 bg-gray-50 p-3 shadow-sm sm:h-[500px] sm:p-5"
          >
            <canvas id="chartElectric" class="h-full w-full"></canvas>
          </div>
        </div>
      </section>
    </main>

    <!-- =====================================================
         Footer
    ====================================================== -->
    <footer class="border-t bg-white py-6 text-center text-sm text-gray-500">
      <p>© 2025 Phuwanat Pahala. All rights reserved</p>
    </footer>

    <!-- =====================================================
         Scripts
    ====================================================== -->

    <script src="JS/graph-electric.js" defer></script>

    <script src="JS/nav.js" defer></script>
  </body>
</html>
