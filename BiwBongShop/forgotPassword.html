<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>ลืมรหัสผ่าน</title>

    <link rel="icon" type="image/png" href="/image/logo.png" />

    <script src="https://cdn.tailwindcss.com"></script>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </head>

  <body class="min-h-screen bg-[#f0fdf9]">
    <main class="flex min-h-screen items-center justify-center px-4 py-8">
      <div class="w-full max-w-md">
        <div
          class="overflow-hidden rounded-3xl border border-emerald-100 bg-white shadow-xl"
        >
          <!-- Header -->
          <div class="bg-[#12352f] px-6 py-8 text-center text-white">
            <div
              class="mx-auto mb-4 flex h-20 w-20 items-center justify-center rounded-2xl bg-white/10 p-2 shadow-lg"
            >
              <img
                src="/image/logo.png"
                alt="Logo"
                class="h-full w-full rounded-xl object-contain"
              />
            </div>

            <h1 class="text-2xl font-bold">ระบบจัดการอุปกรณ์</h1>

            <p class="mt-2 text-sm text-emerald-100/70">กู้คืนบัญชีผู้ใช้งาน</p>
          </div>

          <!-- Form -->
          <form id="forgotPasswordForm" class="px-6 py-7 sm:px-8">
            <div class="mb-6 text-center">
              <div
                class="mx-auto mb-3 flex h-12 w-12 items-center justify-center rounded-full bg-emerald-100 text-emerald-600"
              >
                <i class="fas fa-key text-lg"></i>
              </div>

              <h2 class="text-xl font-bold text-gray-800">ลืมรหัสผ่าน</h2>

              <p class="mt-2 text-sm leading-6 text-gray-500">
                กรอกชื่อผู้ใช้ของคุณเพื่อดำเนินการตรวจสอบ
              </p>
            </div>

            <!-- Username -->
            <div class="mb-5">
              <label
                for="username"
                class="mb-2 block text-sm font-semibold text-gray-700"
              >
                ชื่อผู้ใช้
              </label>

              <div class="relative">
                <span
                  class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-4 text-gray-400"
                >
                  <i class="fas fa-user"></i>
                </span>

                <input
                  type="text"
                  id="username"
                  name="username"
                  placeholder="กรอกชื่อผู้ใช้"
                  required
                  autocomplete="username"
                  class="w-full rounded-xl border border-gray-200 bg-gray-50 py-3 pl-11 pr-4 text-sm text-gray-800 outline-none transition placeholder:text-gray-400 focus:border-emerald-500 focus:bg-white focus:ring-4 focus:ring-emerald-500/10"
                />
              </div>
            </div>

            <!-- Submit -->
            <button
              type="submit"
              class="flex w-full cursor-pointer items-center justify-center gap-2 rounded-xl bg-emerald-600 px-5 py-3.5 text-sm font-bold text-white shadow-sm transition duration-200 hover:bg-emerald-700 hover:shadow-md active:scale-[0.98]"
            >
              <i class="fas fa-search"></i>

              ตรวจสอบ
            </button>

            <!-- Back -->
            <div class="mt-6 border-t border-gray-100 pt-5 text-center">
              <a
                href="/index"
                class="inline-flex items-center gap-2 text-sm font-semibold text-emerald-600 transition hover:text-emerald-700 hover:underline"
              >
                <i class="fas fa-arrow-left text-xs"></i>

                กลับไปหน้าเข้าสู่ระบบ
              </a>
            </div>
          </form>
        </div>

        <p class="mt-5 text-center text-xs text-gray-400">
          © 2568 เว็บระบบยืม-คืนอุปกรณ์ BiwBong
        </p>
      </div>
    </main>

    <script src="JS/auth.js"></script>
    <script src="JS/forgotPassword.js"></script>
  </body>
</html>
