<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>สมัครสมาชิก</title>

    <link rel="icon" type="image/png" href="/image/logo.png" />

    <script src="https://cdn.tailwindcss.com"></script>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>

  <body class="min-h-screen bg-[#f0fdf9]">
    <main class="flex min-h-screen items-center justify-center px-4 py-8">
      <div class="w-full max-w-md">
        <!-- Card -->
        <div
          class="overflow-hidden rounded-3xl border border-emerald-100 bg-white shadow-xl"
        >
          <!-- Header -->
          <div class="bg-[#12352f] px-6 py-8 text-center text-white">
            <div
              class="mx-auto mb-4 flex h-20 w-20 items-center justify-center rounded-2xl bg-white/10 p-2 shadow-lg"
            >
              <img
                src="/image/logo.png"
                alt="Logo"
                class="h-full w-full rounded-xl object-contain"
              />
            </div>

            <h1 class="text-2xl font-bold">สมัครสมาชิก</h1>

            <p class="mt-2 text-sm text-emerald-100/70">
              สร้างบัญชีเพื่อเข้าใช้งานระบบ
            </p>
          </div>

          <!-- Form -->
          <div class="px-6 py-7 sm:px-8">
            <form id="registerForm" class="space-y-5">
              <!-- Username -->
              <div>
                <label
                  for="username"
                  class="mb-2 block text-sm font-semibold text-gray-700"
                >
                  ชื่อผู้ใช้
                </label>

                <div class="relative">
                  <span
                    class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-4 text-gray-400"
                  >
                    <i class="fas fa-user"></i>
                  </span>

                  <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="กรอกชื่อผู้ใช้"
                    required
                    autocomplete="username"
                    class="w-full rounded-xl border border-gray-200 bg-gray-50 py-3 pl-11 pr-4 text-sm text-gray-800 outline-none transition placeholder:text-gray-400 focus:border-emerald-500 focus:bg-white focus:ring-4 focus:ring-emerald-500/10"
                  />
                </div>
              </div>

              <!-- Name -->
              <div>
                <label
                  for="name"
                  class="mb-2 block text-sm font-semibold text-gray-700"
                >
                  ชื่อ-นามสกุล
                </label>

                <div class="relative">
                  <span
                    class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-4 text-gray-400"
                  >
                    <i class="fas fa-id-card"></i>
                  </span>

                  <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="กรอกชื่อ-นามสกุล"
                    required
                    autocomplete="name"
                    class="w-full rounded-xl border border-gray-200 bg-gray-50 py-3 pl-11 pr-4 text-sm text-gray-800 outline-none transition placeholder:text-gray-400 focus:border-emerald-500 focus:bg-white focus:ring-4 focus:ring-emerald-500/10"
                  />
                </div>
              </div>

              <!-- Email -->
              <div>
                <label
                  for="email"
                  class="mb-2 block text-sm font-semibold text-gray-700"
                >
                  อีเมล
                </label>

                <div class="relative">
                  <span
                    class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-4 text-gray-400"
                  >
                    <i class="fas fa-envelope"></i>
                  </span>

                  <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="example@email.com"
                    required
                    autocomplete="email"
                    class="w-full rounded-xl border border-gray-200 bg-gray-50 py-3 pl-11 pr-4 text-sm text-gray-800 outline-none transition placeholder:text-gray-400 focus:border-emerald-500 focus:bg-white focus:ring-4 focus:ring-emerald-500/10"
                  />
                </div>
              </div>

              <!-- Password -->
              <div>
                <label
                  for="password"
                  class="mb-2 block text-sm font-semibold text-gray-700"
                >
                  รหัสผ่าน
                </label>

                <div class="relative">
                  <span
                    class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-4 text-gray-400"
                  >
                    <i class="fas fa-lock"></i>
                  </span>

                  <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="รหัสผ่าน"
                    required
                    autocomplete="new-password"
                    class="w-full rounded-xl border border-gray-200 bg-gray-50 py-3 pl-11 pr-12 text-sm text-gray-800 outline-none transition placeholder:text-gray-400 focus:border-emerald-500 focus:bg-white focus:ring-4 focus:ring-emerald-500/10"
                  />

                  <button
                    type="button"
                    id="togglePassword"
                    aria-label="แสดงรหัสผ่าน"
                    class="absolute inset-y-0 right-0 flex w-12 items-center justify-center text-gray-400 transition hover:text-emerald-600"
                  >
                    <i class="fas fa-eye"></i>
                  </button>
                </div>
              </div>

              <!-- Confirm Password -->
              <div>
                <label
                  for="confirmPassword"
                  class="mb-2 block text-sm font-semibold text-gray-700"
                >
                  ยืนยันรหัสผ่าน
                </label>

                <div class="relative">
                  <span
                    class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-4 text-gray-400"
                  >
                    <i class="fas fa-lock"></i>
                  </span>

                  <input
                    type="password"
                    id="confirmPassword"
                    placeholder="ยืนยันรหัสผ่าน"
                    required
                    autocomplete="new-password"
                    class="w-full rounded-xl border border-gray-200 bg-gray-50 py-3 pl-11 pr-12 text-sm text-gray-800 outline-none transition placeholder:text-gray-400 focus:border-emerald-500 focus:bg-white focus:ring-4 focus:ring-emerald-500/10"
                  />

                  <button
                    type="button"
                    id="toggleConfirmPassword"
                    aria-label="แสดงรหัสผ่าน"
                    class="absolute inset-y-0 right-0 flex w-12 items-center justify-center text-gray-400 transition hover:text-emerald-600"
                  >
                    <i class="fas fa-eye"></i>
                  </button>
                </div>
              </div>

              <!-- Submit -->
              <button
                type="submit"
                class="flex w-full cursor-pointer items-center justify-center gap-2 rounded-xl bg-emerald-600 px-5 py-3.5 text-sm font-bold text-white shadow-sm transition duration-200 hover:bg-emerald-700 hover:shadow-md active:scale-[0.98]"
              >
                <i class="fas fa-user-plus"></i>

                สมัครสมาชิก
              </button>
            </form>

            <!-- Login -->
            <div class="mt-6 border-t border-gray-100 pt-5 text-center">
              <p class="text-sm text-gray-500">
                มีบัญชีอยู่แล้ว?
                <a
                  href="/index"
                  class="font-semibold text-emerald-600 transition hover:text-emerald-700 hover:underline"
                >
                  เข้าสู่ระบบ
                </a>
              </p>
            </div>
          </div>
        </div>

        <!-- Footer -->
        <p class="mt-5 text-center text-xs text-gray-400">
          © 2568 เว็บระบบยืม-คืนอุปกรณ์ BiwBong
        </p>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="JS/auth.js"></script>

    <script src="JS/register.js"></script>
  </body>
</html>
